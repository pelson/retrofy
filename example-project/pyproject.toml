[build-system]
requires = ["multistage-build>=0.4", "setuptools", "retrofy>=0.3"]
build-backend = "multistage_build:backend"

[tool.multistage-build]
build-backend = "setuptools.build_meta"

[project]
name = "retrofy-test-project"
version = "0.1"
description = "A project full of the latest and greatest Python (syntax) features"
# ``requires-python`` is dynamic: retrofy supplies ``>=`` its
# ``[tool.retrofy] target-python`` (the on-disk source itself needs 3.15,
# for PEP 810 ``lazy from`` and other new syntax, but the built artefacts
# are lowered). Retrofy also injects ``Requires-Dist: retrofy`` for
# editable installs (it needs retrofy at runtime for the import-time
# rewriter); PEP 621 requires both to be opted into via ``dynamic``.
dynamic = ["dependencies", "requires-python"]

[project.optional-dependencies]
test = [
  "pytest",
]
typecheck = [
  "mypy",
]
dev = [
  # Include the "test" and "doc" dependencies in the dev dependencies.
  "example-project[doc,test,typecheck]",
]

[tool.setuptools.packages.find]
include = ["example_project", "example_project.*"]

[tool.retrofy]
# Target floor for both the lowered wheel (post-build-wheel) and the
# lowered sdist (post-build-sdist). The on-disk source is 3.15+;
# retrofy rewrites both artefacts so they install on the floor below.
# Set deliberately broad to exercise retrofy's lowering reach.
target-python = "3.7"
# The Python the on-disk source runs on unconverted (PEP 810 ``lazy from``
# and other 3.15 syntax).
source-python = "3.15"

# The on-disk source uses post-current-Python syntax that retrofy
# backports at build / import time. Tell ruff to lint it against the
# Python version where that syntax is native, not the ``requires-python``
# floor above (which is the *runtime* floor after retrofy converts the
# source).
[tool.ruff]
target-version = "py315"

# Mypy runs against the *converted* form of example_project (as it
# lands in the built wheel). The pre-conversion source uses Python
# 3.15+ ``lazy`` soft-keyword syntax that mypy does not yet parse.
# Modern mypy only supports 3.9+ as a target, so we cannot literally
# match the ``requires-python = ">=3.7"`` floor here — 3.9 is the
# tightest mypy will accept.
[tool.mypy]
python_version = "3.9"
strict = true
